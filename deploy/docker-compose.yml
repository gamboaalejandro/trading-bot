# Usage (from the repo root):
#   cp .env.example .env   # fill in values; .env is git-ignored
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f bot
services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: trading_bot
    env_file: ../.env
    environment:
      TZ: UTC
    volumes:
      - ../data/live:/app/data/live
      - ../config/risk_limits.yml:/app/config/risk_limits.yml:ro
    restart: unless-stopped

  recorder:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: trading_recorder
    command: ["python", "-m", "apps.live.recorders"]
    environment:
      TZ: UTC
    volumes:
      - ../data/recorders:/app/data/recorders
    restart: unless-stopped
